priorityClasses:
  critical:
    name: critical
    value: 100000
  low:
    name: low
    value: 1000

podDisruptionBudgets:
  api:
    minAvailable: 3
  postgres:
    minAvailable: 1

api:
  priorityClassName: critical
  scheduling:
    strategy: topologySpreadConstraints
  replicaCount: 4
  image:
    repository: shop-api
    tag: "v3"
    pullPolicy: IfNotPresent
  port: 5000
  healthFail: false
  resources:
    requests:
      cpu: "25m"
      memory: "100Mi"
    limits:
      cpu: "25m"
      memory: "100Mi"

worker:
  replicaCount: 2
  image:
    repository: shop-worker
    tag: "v1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "10m"
      memory: "100Mi"
    limits:
      cpu: "300m"
      memory: "100Mi"

batch:
  priorityClassName: low
  replicaCount: 2
  image:
    repository: shop-batch
    tag: "v1"
    pullPolicy: IfNotPresent
  cpuWorkers: 0
  memStepMb: 50
  memIntervalS: 3
  memMaxMb: 700
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

postgres:
  priorityClassName: critical
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

k6:
  enabled: true
  image:
    repository: docker.io/grafana/k6
    tag: latest
    pullPolicy: IfNotPresent
  vus: 10
  duration: 5m

  rate: 5
  timeUnit: 1s
  preAllocatedVUs: 5
  maxVUs: 20

  thresholds:
    http_req_duration:
      - "p(95)<3000"
    http_req_failed:
      - "rate<0.05"

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "256Mi"