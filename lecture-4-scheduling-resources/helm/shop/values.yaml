priorityClasses:
  critical:
    name: critical
    value: 100000
  low:
    name: low
    value: 1000

podDisruptionBudgets:
  api:
    minAvailable: 3
  postgres:
    minAvailable: 1

api:
  priorityClassName: critical
  scheduling:
    strategy: topologySpreadConstraints
  replicaCount: 4
  image:
    repository: shop-api
    tag: "v3"
    pullPolicy: IfNotPresent
  port: 5000
  healthFail: false
  resources:
    requests:
      cpu: "25m"
      memory: "100Mi"
    limits:
      cpu: "25m"
      memory: "100Mi"

worker:
  replicaCount: 2
  image:
    repository: shop-worker
    tag: "v1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "10m"
      memory: "100Mi"
    limits:
      cpu: "300m"
      memory: "100Mi"

batch:
  priorityClassName: low
  replicaCount: 3
  image:
    repository: shop-batch
    tag: "v1"
    pullPolicy: IfNotPresent
  cpuWorkers: 0
  memStepMb: 25
  memIntervalS: 1
  memMaxMb: 2000
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "4Gi"

postgres:
  priorityClassName: critical
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

k6:
  enabled: false
  image:
    repository: docker.io/grafana/k6
    tag: latest
    pullPolicy: IfNotPresent
  vus: 10
  duration: 15m
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "256Mi"