apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-api-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: shop-api.rules
      rules:
        - alert: ShopApiDown
          expr: up{service="shop-api"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Shop API is unavailable
            description: Prometheus cannot scrape the Shop API.

        - alert: ShopApiHighLatency
          expr: histogram_quantile(0.95, sum by (le) (rate(http_response_time_seconds_bucket{service="shop-api"}[5m]))) > 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Shop API latency is high
            description: API p95 latency exceeds 2 seconds.

        - alert: ShopApiHighErrorRate
          expr: sum(rate(http_requests_total{service="shop-api",status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{service="shop-api"}[5m])), 0.001) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Shop API error rate is high
            description: More than 5 percent of API requests return HTTP 5xx.