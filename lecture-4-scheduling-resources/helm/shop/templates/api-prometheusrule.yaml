apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-api-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: shop-api
      rules:
        - alert: APIHigh5xxErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[2m]))
            /
            clamp_min(sum(rate(http_requests_total[2m])), 1)
            > 0.1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Высокая доля ошибок 5xx"
            description: "Более 10% запросов к API завершаются ошибками 5xx."

        - alert: APIHighP95Latency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_response_time_seconds_bucket[5m])
              )
            ) > 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Высокая задержка API"
            description: "P95 времени ответа API превышает 2 секунды."

        - alert: APIMetricsMissing
          expr: absent(up{namespace="default", service="shop-api"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Метрики API отсутствуют"
            description: "Prometheus не получает метрики shop-api."