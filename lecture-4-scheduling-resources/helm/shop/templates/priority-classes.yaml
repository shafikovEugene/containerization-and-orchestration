apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.critical.name }}
value: {{ .Values.priorityClasses.critical.value }}
globalDefault: false
description: "Critical workloads: API and PostgreSQL"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.low.name }}
value: {{ .Values.priorityClasses.low.value }}
globalDefault: false
description: "Low priority workloads: batch"