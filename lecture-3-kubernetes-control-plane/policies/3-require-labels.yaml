apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-labels
  annotations:
    policies.kyverno.io/title: Require labels
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every pod must define app and owner labels.
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - cnpg-system
            - kyverno
            - monitoring
    objectSelector:
      matchExpressions:
        - key: cnpg.io/cluster
          operator: DoesNotExist
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'app' in object.metadata.labels &&
        'owner' in object.metadata.labels
      message: "Every pod must define app and owner labels."